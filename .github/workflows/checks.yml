name: Speed and screenshots

# For every pull request: the app built from the pull request and from its base, side by side on one machine.
# - Speed check (tools/perfguard.cjs): the common actions timed on both, run by run in turn, at 4x CPU slowdown. It
#   fails only when an action is 30% and 30 ms slower and stays so when measured again.
# - Screenshot check (tools/shotdiff.cjs): every main page, the Beans views, the main sheets and the + menu, light and
#   dark, compared pixel by pixel. It never fails (a change can be intended); it lists what changed.
# Both post one comment on the pull request (updated on each push) and keep the changed screenshots as an artifact.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: pr
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build both
        run: |
          (cd base && python3 tools/build.py)
          (cd pr && python3 tools/build.py)
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}
      - name: Install Playwright and Chromium
        working-directory: pr
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Serve both
        run: |
          (cd base && python3 -m http.server 8098 >/dev/null 2>&1 &)
          (cd pr && python3 -m http.server 8099 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8098/index.html && curl -sf -o /dev/null http://localhost:8099/index.html && break; sleep 1; done
      - name: Screenshot check
        working-directory: pr
        run: node tools/shotdiff.cjs
      - name: Speed check
        id: speed
        working-directory: pr
        continue-on-error: true
        run: node tools/perfguard.cjs 3
      - name: Keep the changed screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: pr/shotdiff
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => { try { return fs.readFileSync(f, 'utf8') } catch (e) { return '' } };
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = '<!-- bb-checks -->\n' + (read('pr/perfguard.md') || '### Speed check\nDid not finish.\n') + '\n' +
              (read('pr/shotdiff.md') || '### Screenshot check\nDid not finish.\n') + `\n[This run and its screenshots](${run})\n`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = data.find(c => c.body && c.body.startsWith('<!-- bb-checks -->'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Fail on a real slowdown
        if: steps.speed.outcome == 'failure'
        run: |
          echo "An action is slower than on the base (see the comment on the pull request)."
          exit 1
