name: Deploy to GitHub Pages

# Builds the site and publishes it to the gh-pages branch, which GitHub Pages
# serves at https://maheralshokry.github.io/brew-bench/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build site
        run: python3 tools/build.py --site _site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
          commit_message: Deploy site from ${{ github.sha }}
